{{- if not .Values.postgres.existingSecret }}
{{/*
Rendered only when the operator has not supplied their own Secret.

This holds a lab credential, not a secret: the value is the chart default
documented in SECURITY.md, the cluster is disposable, and nothing is exposed
beyond localhost. Set postgres.existingSecret to point at a Secret you manage
yourself -- with SOPS, Sealed Secrets, or an external secrets operator -- for
anything that is not this bench.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ticketflow.fullname" . }}
  labels:
    {{- include "ticketflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.auth.password | quote }}
{{- end }}
